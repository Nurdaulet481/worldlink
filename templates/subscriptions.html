{% extends 'base.html' %}

{% block content %}
<div class="subs-container">
    <!-- Верхняя лента аватарок подписок (YouTube / Instagram Stories style) -->
    <div class="subs-header">
        <h3 class="subs-title">Мои подписки</h3>
        <div class="subs-avatars-row" id="subsAvatarsRow">
            <div class="subs-loading">Загрузка подписок...</div>
        </div>
    </div>

    <hr class="subs-divider">

    <!-- Лента публикаций от подписок -->
    <div class="subs-feed-section">
        <div class="subs-feed" id="subsFeed">
            <div class="empty-feed">Загрузка публикаций...</div>
        </div>
    </div>
</div>

<!-- Подключаем скрипт с кэш-бастингом (v=3.0) -->
<script src="{{ url_for('static', filename='js/subscriptions.js') }}?v=3.0"></script>
{% endblock %}
