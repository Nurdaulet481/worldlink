<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}WorldLink{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <!-- Иконки FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Шапка без поиска -->
    <header class="navbar">

        <div class="logo">
            <a href="/">WorldLink</a>
        </div>

        <div class="nav-right">
            <button class="btn-create" id="openCreatePostBtn">+ Создать</button>

            <a href="/profile" class="nav-profile-link">
                <div class="nav-avatar">ОФИ</div>
            </a>
        </div>

    </header>


    <!-- Основной контент -->
    <div class="main-container">

        <!-- Боковое меню -->
        <aside class="sidebar">

            <a href="/">
                <i class="fa fa-home"></i>
                Главная
            </a>

            <a href="/subscriptions">
                <i class="fa fa-users"></i>
                Подписки
            </a>

            <a href="/messages">
                <i class="fa fa-comments"></i>
                Мессенджер
            </a>

            <a href="/profile">
                <i class="fa fa-user"></i>
                Профиль
            </a>

        </aside>


        <!-- Контент страницы -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>

    </div>


    <!-- Модальное окно создания поста -->
    <div class="modal-overlay" id="createPostModal" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Создать новый пост</h3>
                <button class="close-modal-btn" id="closeCreatePostModal">&times;</button>
            </div>
            <form id="createPostForm">
                <div class="form-group">
                    <label>Выберите фото или видео (3:4)</label>
                    <input type="file" id="postFileInput" accept="image/*,video/*" required>
                </div>
                <div class="form-group">
                    <label>Описание поста</label>
                    <textarea id="postCaptionInput" rows="3" placeholder="Напишите что-нибудь..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancelPostBtn">Отмена</button>
                    <button type="submit" class="btn-save">Опубликовать</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Скрипт управления модальным окном и публикацией постов -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const createModal = document.getElementById('createPostModal');
            const openBtn = document.getElementById('openCreatePostBtn');
            const closeBtn = document.getElementById('closeCreatePostModal');
            const cancelBtn = document.getElementById('cancelPostBtn');
            const createForm = document.getElementById('createPostForm');

            function openModal() {
                if (createModal) createModal.style.display = 'flex';
            }

            function closeModal() {
                if (createModal) {
                    createModal.style.display = 'none';
                    createForm.reset();
                }
            }

            if (openBtn) openBtn.addEventListener('click', openModal);
            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

            // Закрытие при клике вне окна
            window.addEventListener('click', (e) => {
                if (e.target === createModal) {
                    closeModal();
                }
            });

            // Отправка формы поста на backend /api/posts/create
            if (createForm) {
                createForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const fileInput = document.getElementById('postFileInput');
                    const captionInput = document.getElementById('postCaptionInput');

                    if (!fileInput.files[0]) {
                        alert('Пожалуйста, выберите файл');
                        return;
                    }

                    const formData = new FormData();
                    formData.append('file', fileInput.files[0]);
                    formData.append('caption', captionInput.value);

                    try {
                        const response = await fetch('/api/posts/create', {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();

                        if (result.status === 'success') {
                            closeModal();
                            // Перезагружаем страницу, чтобы увидеть новый пост в ленте или профиле
                            window.location.reload();
                        } else {
                            alert(result.message || 'Ошибка при загрузке поста');
                        }
                    } catch (error) {
                        console.error('Ошибка:', error);
                        alert('Произошла ошибка при отправке поста');
                    }
                });
            }
        });
    </script>

    {% block scripts %}{% endblock %}

</body>
</html>
