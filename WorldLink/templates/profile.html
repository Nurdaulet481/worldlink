{% extends 'base.html' %}

{% block content %}
<div class="profile-container" data-target-id="{{ target_user_id }}">
    <div class="profile-card">
        <div class="profile-header-bg"></div>
        <div class="profile-main-info">
            <div class="profile-avatar" id="profAvatar">?</div>
            <div class="profile-actions">
                <button id="subBtn" class="btn-sub" style="display: none;">Подписаться</button>
                <button id="editBtn" class="btn-edit" style="display: none;">Редактировать профиль</button>
            </div>
        </div>

        <div class="profile-details">
            <div class="name-age-block">
                <h2 id="profName">Загрузка...</h2>
                <span class="age-badge" id="profAge">-- лет</span>
            </div>
            <span class="username" id="profUsername">@username</span>
            <p class="bio" id="profBio">Описание профиля...</p>
        </div>

        <!-- Статистика с кликабельными списками -->
        <div class="profile-stats">
            <div class="stat-item">
                <span class="stat-value" id="postsCount">0</span>
                <span class="stat-label">Публикации</span>
            </div>
            <div class="stat-item clickable" id="followersStat">
                <span class="stat-value" id="followersCount">0</span>
                <span class="stat-label">Подписчики</span>
            </div>
            <div class="stat-item clickable" id="followingStat">
                <span class="stat-value" id="followingCount">0</span>
                <span class="stat-label">Подписки</span>
            </div>
        </div>
    </div>

    <!-- Вкладки: Посты, Репосты, Лайки, Сохраненные -->
    <div class="profile-tabs">
        <button class="tab-btn active" data-tab="posts">Посты</button>
        <button class="tab-btn" data-tab="reposts">Репосты</button>
        <button class="tab-btn" data-tab="likes">Лайки</button>
        <button class="tab-btn" data-tab="saved">Сохраненные</button>
    </div>

    <!-- Сетка публикаций профиля -->
    <div class="profile-feed" id="userPosts">
        <div class="profile-posts-grid" id="postsGridContainer">
            <!-- Плитки 4-в-ряд рендерятся через profile.js -->
        </div>
        <div class="empty-feed" id="emptyFeedMsg" style="display: none;">
            Здесь пока нет публикаций
        </div>
    </div>
</div>

<!-- Модальное окно просмотра поста при клике на плитку -->
<div class="modal-overlay" id="postModal">
    <div class="modal-card post-modal-card">
        <button class="close-modal-btn" id="closePostModal">&times;</button>
        <div class="post-modal-content" id="postModalContent">
            <!-- Динамически заполняется через JS -->
        </div>
    </div>
</div>

<!-- Модальное окно редактирования профиля -->
<div class="modal-overlay" id="editModal">
    <div class="modal-card">
        <h3>Редактировать профиль</h3>
        <div class="form-group">
            <label>Имя</label>
            <input type="text" id="editName">
        </div>
        <div class="form-group">
            <label>Никнейм (@username)</label>
            <input type="text" id="editUsername">
        </div>
        <div class="form-group">
            <label>Возраст</label>
            <input type="number" id="editAge">
        </div>
        <div class="form-group">
            <label>О себе (Bio)</label>
            <textarea id="editBio" rows="3"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelEditBtn">Отмена</button>
            <button class="btn-save" id="saveEditBtn">Сохранить</button>
        </div>
    </div>
</div>

<!-- Модальное окно списка подписчиков/подписок -->
<div class="modal-overlay" id="listModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="listModalTitle">Пользователи</h3>
            <button class="close-modal-btn" id="closeListModal">&times;</button>
        </div>
        <div class="users-list" id="usersListContainer">
            <!-- Список генерируется через JS -->
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/profile.js') }}?v=2.0"></script>
{% endblock %}
